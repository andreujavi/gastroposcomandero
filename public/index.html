<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastroPOS - Comandas</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f9; }
        .estado { padding: 10px; margin-bottom: 20px; border-radius: 5px; color: white; text-align: center; font-weight: bold;}
        .conectado { background: #28a745; }
        .desconectado { background: #dc3545; }
        .caja { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; width: 100%; cursor: pointer;}
        #lista-comandas { margin-top: 20px; list-style: none; padding: 0; }
        #lista-comandas li { padding: 10px; background: #e9ecef; margin-bottom: 5px; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="estado-conexion" class="estado desconectado">🔴 Servidor Desconectado</div>

    <div class="caja">
        <h2>Nueva Comanda</h2>
        <button id="btn-enviar">Enviar Café ☕ a todas las pantallas</button>
        
        <ul id="lista-comandas">
            <!-- Las comandas aparecerán aquí -->
        </ul>
    </div>

   <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    
    <!-- 2. Tu código visual -->
    <script src="index.js"></script>
</body>
</html>
