# fly.toml app configuration generated for comandero on 2026-08-07T23:30:00Z
app = "comandero"
primary_region = "cdg"

[build]
  # Si tienes un Dockerfile en la raíz, esto es todo lo que necesitas
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000   # <--- IMPORTANTE: Cambia este número por el puerto donde escucha tu app
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1