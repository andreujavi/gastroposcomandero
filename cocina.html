<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastroPOS - Panel de Cocina y Barra (Responsive)</title>
    <style>
        :root {
            --bg-body: #f1f5f9;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --primary-color: #3b82f6;
            --success-color: #10b981;
            --success-hover: #059669;
            --border-color: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px -2px rgba(0,0,0,0.08);
            --shadow-hover: 0 10px 20px -3px rgba(0,0,0,0.12);
        }

        /* Reset global adaptativo */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            margin: 0;
            padding: 15px;
            -webkit-text-size-adjust: 100%;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }

        /* Encabezado flexible */
        .header-wrapper {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        h1 {
            font-size: clamp(1.4rem, 2.5vw, 1.8rem);
            font-weight: 800;
            margin: 0;
            color: var(--text-primary);
        }

        .estado-conexion {
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 14px;
            background: #f8fafc;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            white-space: nowrap;
        }

        /* 2 Columnas altamente adaptativas */
        .columns-wrapper {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        @media (max-width: 768px) {
            body {
                padding: 8px;
            }
            .container {
                padding: 12px;
            }
            .columns-wrapper {
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }

        .column {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 15px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }

        .column h2 {
            text-align: center;
            font-size: 1.15rem;
            font-weight: 700;
            padding-bottom: 10px;
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border-color);
        }

        /* Contenedor interior fluido para las tarjetas */
        .column-content {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            gap: 12px;
        }

        /* Tarjetas de Comandas Responsive */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--primary-color);
            border-radius: var(--radius-md);
            padding: 14px;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            width: 100%;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #f1f5f9;
        }

        .card-header span:first-child {
            background: #eff6ff;
            color: var(--primary-color);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .card-header span:last-child {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .card-body {
            font-size: 0.95rem;
            font-weight: 500;
            color: #334155;
            margin-bottom: 12px;
            line-height: 1.5;
            word-break: break-word;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        /* Botón optimizado para pantallas táctiles (móviles y tablets) */
        .btn-servir {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: background-color 0.2s ease, transform 0.1s ease;
            white-space: nowrap;
            min-height: 38px;
        }

        .btn-servir:hover {
            background-color: var(--success-hover);
        }

        .btn-servir:active {
            transform: scale(0.97);
        }

        .empty-column {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            padding: 40px 15px;
            border: 2px dashed #cbd5e1;
            border-radius: var(--radius-md);
            margin: auto;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-wrapper">
            <h1>👨‍🍳 Panel de Cocina y Barra</h1>
            <div id="estado-conexion" class="estado-conexion">Conectando...</div>
        </div>
        
        <div class="columns-wrapper">
            <!-- Columna 1: Barra -->
            <div class="column">
                <h2>🍹 Barra</h2>
                <div id="lista-barra" class="column-content">
                    <p class="empty-column">Cargando barra...</p>
                </div>
            </div>

            <!-- Columna 2: Cocina -->
            <div class="column">
                <h2>🍔 Cocina</h2>
                <div id="lista-cocina" class="column-content">
                    <p class="empty-column">Cargando cocina...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const URL_SERVIDOR = 'http://192.168.1.150:3000/api/pedidos';
        const lblEstado = document.getElementById('estado-conexion');

        function crearTarjetaDOM(pedido) {
            const tarjeta = document.createElement('div');
            tarjeta.className = 'card';
            
            tarjeta.innerHTML = `
                <div class="card-header">
                    <span>Mesa #${pedido.mesa_id}</span>
                    <span>#${pedido.id}</span>
                </div>
                <div class="card-body">
                    ${pedido.detalles}
                </div>
                <div class="card-footer">
                    <span>🕒 ${pedido.created_at}</span>
                    <button class="btn-servir" onclick="eliminarComandaServidor(${pedido.id})">✓ Servido</button>
                </div>
            `;
            return tarjeta;
        }

        function mostrarPedidosEnPantalla(data) {
            const pedidos = data.pedidos || [];
            
            const divBarra = document.getElementById('lista-barra');
            const divCocina = document.getElementById('lista-cocina');

            divBarra.innerHTML = '';
            divCocina.innerHTML = '';

            let hayBarra = false;
            let hayCocina = false;

            pedidos.forEach(pedido => {
                const texto = (pedido.detalles || '').toLowerCase();
                const tarjeta = crearTarjetaDOM(pedido);

                const esBarra = texto.includes('[bebida]') || texto.includes('[barra]') || texto.includes('bebida') || texto.includes('agua') || texto.includes('refresco') || texto.includes('cerveza') || texto.includes('copa') || texto.includes('combinado') || texto.includes('gin') || texto.includes('ron') || texto.includes('vino') || texto.includes('cola');

                if (esBarra) {
                    hayBarra = true;
                    divBarra.appendChild(tarjeta);
                } else {
                    hayCocina = true;
                    divCocina.appendChild(tarjeta);
                }
            });

            if (!hayBarra) divBarra.innerHTML = '<p class="empty-column">No hay pedidos en barra</p>';
            if (!hayCocina) divCocina.innerHTML = '<p class="empty-column">No hay pedidos en cocina</p>';
        }

        async function refrescarServidor() {
            try {
                const respuesta = await fetch(URL_SERVIDOR);
                if (!respuesta.ok) throw new Error();
                
                const datos = await respuesta.json();
                lblEstado.textContent = "🟢 En Línea";
                lblEstado.style.color = "#10b981";
                mostrarPedidosEnPantalla(datos);
            } catch (error) {
                lblEstado.textContent = "🔴 Desconectado";
                lblEstado.style.color = "#ef4444";
            }
        }

        async function eliminarComandaServidor(idPedido) {
            if (!confirm(`¿Marcar el pedido #${idPedido} como servido y borrarlo?`)) return;

            try {
                const respuesta = await fetch(`${URL_SERVIDOR}/${idPedido}`, {
                    method: 'DELETE'
                });

                if (respuesta.ok) {
                    refrescarServidor();
                } else {
                    alert('No se pudo completar la acción en el servidor.');
                }
            } catch (error) {
                console.error('Error de red:', error);
                alert('Error de red al intentar conectar con el servidor.');
            }
        }

        refrescarServidor();
        setInterval(refrescarServidor, 3000);
    </script>
</body>
</html>
